name: Release

# Pousser un tag de version (ex. : git tag V1.1.0 && git push origin V1.1.0)
# compile l'exécutable et publie ModInjector.zip dans une release GitHub.
on:
  push:
    tags: ["V*"]

permissions:
  contents: write

jobs:
  release:
    name: Build et publication
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Vérifier que le tag correspond à la version
        shell: pwsh
        run: |
          $version = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ("${{ github.ref_name }}" -ne "V$version") {
            Write-Error "Le tag ${{ github.ref_name }} ne correspond pas à la version V$version de pyproject.toml"
            exit 1
          }

      - name: Compiler l'exécutable
        run: uv run python scripts/build.py

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" livraison/ModInjector.zip --title "ModInjector ${{ github.ref_name }}" --generate-notes
