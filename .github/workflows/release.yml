name: Release

# Pushing a version tag (e.g. git tag V1.1.0 && git push origin V1.1.0)
# builds the executable and publishes ModInjector.zip in a GitHub release.
on:
  push:
    tags: ["V*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests (pytest)
        run: uv run pytest -q

      - name: Check that the tag matches the version
        shell: pwsh
        run: |
          $version = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ("${{ github.ref_name }}" -ne "V$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match version V$version in pyproject.toml"
            exit 1
          }

      - name: Build the executable
        run: uv run python scripts/build.py

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" livraison/ModInjector.zip --title "ModInjector ${{ github.ref_name }}" --generate-notes
