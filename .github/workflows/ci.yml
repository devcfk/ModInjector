name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest -q
