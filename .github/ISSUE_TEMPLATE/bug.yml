name: 🐞 Bug
description: Signaler un problème
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le problème et ce que vous attendiez.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir l'onglet Mods
        2. Cliquer sur DÉPLOYER
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version de ModInjector
      placeholder: V1.0.0
  - type: textarea
    id: journal
    attributes:
      label: Journal (log)
      description: Copiez le contenu du journal affiché dans l'application.
      render: text
