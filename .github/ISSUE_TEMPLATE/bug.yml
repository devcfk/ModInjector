name: 🐞 Bug report
description: Report a problem
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Mods tab
        2. Click DÉPLOYER LES MODS (Deploy mods)
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModInjector version
      placeholder: V1.1.0
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the content of the log shown in the application.
      render: text
