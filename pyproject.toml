[project]
name = "modinjector"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=13.0.0",
]

[tool.pyright]
extraPaths = ["src/modinjector"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]


[tool.pytest.ini_options]
pythonpath = ["src/modinjector"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs (pyflakes), I : tri des imports,
# B : bugs probables, UP : syntaxe moderne, SIM : simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# E501 : la longueur des lignes est gérée par `ruff format` (les longues chaînes sont tolérées)
# SIM105/SIM108 : try/except/pass et if/else explicites restent acceptés quand ils sont plus lisibles
ignore = ["E501", "SIM105", "SIM108"]
